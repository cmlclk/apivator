# Web arayüzünü sunar, /api ve /hubs isteklerini API container'ına iletir (tek origin).
# Önünde TLS sonlandıran bir proxy (Caddy, şirket load balancer'ı) olabilir; onun gönderdiği
# X-Forwarded-Proto korunur, yoksa bu bağlantının şeması kullanılır.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Erişim logunda sorgu dizgisi yazılmaz: canlı kanalın access_token'ı ve davet/sıfırlama token'ları orada.
log_format apivator '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '$request_time "$http_user_agent" "$http_x_forwarded_for"';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log apivator;

  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Runner sonuçları akış olarak gelir (NDJSON); tamponlanmadan iletilir.
    proxy_buffering off;
    proxy_read_timeout 15m;
  }

  # Mock sunucuları (/mock/{anahtar}/...): yanıt ve header'lar olduğu gibi API'den gelir.
  location /mock/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    client_max_body_size 2m;
    # Örneklerde 60 sn'ye kadar gecikme tanımlanabilir.
    proxy_read_timeout 2m;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }
}

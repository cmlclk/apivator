[package]
name = "apivator-desktop"
version = "1.0.0"
description = "Apivator masaüstü uygulaması"
edition = "2021"
rust-version = "1.80"

[lib]
name = "apivator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
getrandom = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
url = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[features]
# Otomatik güncelleme: imza anahtarı ve yayın adresi ayarlandığında (yayın iş akışı) açılır.
# Yerel derlemeler güncelleme aramaz.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

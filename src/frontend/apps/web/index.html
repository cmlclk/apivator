<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- SSO dönüşündeki giriş kodu ve bağlantı belirteçleri başka sitelere Referer ile sızmasın. -->
    <meta name="referrer" content="no-referrer" />
    <title>Apivator</title>
    <script>
      // Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('apivator-ui') || '{}').state || {};
          var theme = saved.theme || 'system';
          var dark =
            theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

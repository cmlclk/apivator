name: Masaüstü CI

# Yalnızca masaüstü (Rust/Tauri) kodu değişince çalışır; Actions dakikalarından tasarruf için ana CI'dan ayrıldı.
on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/apps/desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'src/frontend/apps/desktop/**'
      - '.github/workflows/desktop-ci.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Masaüstü (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/apps/desktop/src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev libayatana-appindicator3-dev
      # tauri-build yalnızca paketlenecek sidecar dosyalarının varlığına bakar; denetim için .NET sidecar'larını derlemek
      # gerekmez, boş yer tutucu yeterli (gerçekleri yayın iş akışında derlenir).
      - run: mkdir -p binaries && touch binaries/apivator-agent-x86_64-unknown-linux-gnu binaries/apivator-api-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Yayın derlemesi updater özelliğiyle yapılır; o kod yolu da denetlenir.
      - run: cargo clippy --all-targets --features updater -- -D warnings
      - run: cargo test

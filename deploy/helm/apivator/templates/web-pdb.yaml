{{- if and .Values.web.podDisruptionBudget.enabled (gt (int .Values.web.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "apivator.fullname" . }}-web
  labels:
    {{- include "apivator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "apivator.selector" (dict "root" . "component" "web") | nindent 6 }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
{{- /* API yalnızca web pod'larından ve ingress controller'dan gelen trafiği kabul eder; pod içi istemciler X-Forwarded-For'u sahteleyemez. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apivator.fullname" . }}-api
  labels:
    {{- include "apivator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apivator.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "apivator.selector" (dict "root" . "component" "web") | nindent 14 }}
        {{- with .Values.networkPolicy.ingressControllerNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - port: 8080
{{- end }}

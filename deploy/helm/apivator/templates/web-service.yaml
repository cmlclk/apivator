apiVersion: v1
kind: Service
metadata:
  name: {{ include "apivator.fullname" . }}-web
  labels:
    {{- include "apivator.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "apivator.selector" (dict "root" . "component" "web") | nindent 4 }}

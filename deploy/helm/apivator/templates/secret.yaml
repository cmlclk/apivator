{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apivator.secretName" . }}
  labels:
    {{- include "apivator.labels" . | nindent 4 }}
  {{- if eq .Values.migration.mode "job" }}
  annotations:
    # Migration Job'u (pre-install/pre-upgrade) Secret'a ihtiyaç duyar; bu yüzden ondan önce oluşturulur.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
type: Opaque
stringData:
  jwt-signing-key: {{ .Values.secrets.jwtSigningKey | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  smtp-password: {{ .Values.secrets.smtpPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
{{- end }}
